<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcards - Khóa Dữ Liệu An Toàn</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --accent-color: #e67e22;
            --sync-color: #2ecc71;
            --bg-color: #f5f7fa;
            --text-color: #333;
            --success-color: #2ecc71;
            --error-color: #e74c3c;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; align-items: center; padding: 1.5rem; }
        header { margin-bottom: 1.5rem; text-align: center; }
        header h1 { color: var(--primary-color); font-size: 1.8rem; }
        .container { width: 100%; max-width: 600px; }
        .sync-panel { background: #2c3e50; color: #fff; padding: 0.8rem 1rem; border-radius: 10px; font-size: 0.85rem; margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center; }
        .btn-refresh { background: var(--sync-color); color: white; border: none; padding: 0.4rem 0.8rem; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 0.8rem; }
        .audio-wrapper { width: 100%; display: flex; justify-content: flex-start; margin-bottom: 0.5rem; }
        .btn-speak { background: #ffffff; border: 2px solid var(--primary-color); color: var(--primary-color); border-radius: 50%; width: 48px; height: 48px; font-size: 1.4rem; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .flashcard-wrapper { perspective: 1000px; margin-bottom: 1rem; }
        .flashcard { width: 100%; height: 220px; background: white; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.08); cursor: pointer; transform-style: preserve-3d; transition: transform 0.25s ease; position: relative; }
        .flashcard.flip { transform: rotateY(180deg); }
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 1.5rem; border-radius: 15px; text-align: center; }
        .card-front { background: white; color: var(--primary-color); }
        .card-front h2 { font-size: 2.5rem; margin-bottom: 0.2rem; }
        .card-front .type { font-style: italic; color: #777; margin-bottom: 0.8rem; }
        .card-front .hint-meaning { color: #555; font-size: 1.1rem; border-top: 1px dashed #ddd; padding-top: 0.5rem; width: 80%; }
        .card-back { background: var(--primary-color); color: white; transform: rotateY(180deg); }
        .card-back h2 { font-size: 2.2rem; }
        .controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; gap: 10px; }
        .btn-nav { background: #fff; border: 1px solid #ddd; padding: 0.5rem 1rem; border-radius: 5px; cursor: pointer; font-weight: 600; }
        .btn-random { background: var(--accent-color); color: white; border: none; }
        #card-indicator { font-weight: bold; color: #666; min-width: 60px; text-align: center; }
        .practice-section { background: white; padding: 1.5rem; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 1.5rem; border-top: 4px solid var(--accent-color); }
        .practice-prompt { font-size: 1rem; color: #555; margin-bottom: 0.8rem; font-weight: 500; }
        .practice-input-group { display: flex; gap: 8px; }
        .practice-input-group input { flex: 1; padding: 0.7rem; border: 2px solid #ddd; border-radius: 5px; font-size: 1.1rem; font-weight: bold; text-align: center; }
        .practice-input-group button { background: #2c3e50; color: white; border: none; padding: 0.7rem 1.2rem; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .practice-result { font-weight: bold; margin-top: 0.8rem; font-size: 0.95rem; text-align: center; display: none; }
        .input-section { background: white; padding: 1.2rem; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 1.5rem; display: flex; gap: 8px; flex-wrap: wrap; }
        .input-section input { flex: 1; min-width: 120px; padding: 0.6rem; border: 1px solid #ddd; border-radius: 5px; font-size: 0.9rem; }
        .input-section button { background: var(--primary-color); color: white; border: none; padding: 0.6rem 1.2rem; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .word-list-section { background: white; padding: 1.2rem; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .word-list-section h3 { margin-bottom: 0.8rem; color: #555; display: flex; justify-content: space-between; align-items: center; font-size: 1.1rem; }
        .word-list { max-height: 200px; overflow-y: auto; }
        .word-item { display: flex; justify-content: space-between; align-items: center; padding: 0.6rem 0; border-bottom: 1px solid #eee; font-size: 0.9rem; }
        .btn-delete { background: #ff7675; color: white; border: none; padding: 0.2rem 0.5rem; border-radius: 3px; cursor: pointer; font-size: 0.8rem; }
    </style>
</head>
<body>

    <header>
        <h1>Shared English Flashcards</h1>
        <p>Bản sửa lỗi đồng bộ - Khóa dữ liệu nhập an toàn tuyệt đối</p>
    </header>

    <div class="container">
        <div class="sync-panel">
            <span>📊 Bộ nhớ máy: <span id="status-text">Đang đọc...</span></span>
            <button class="btn-refresh" onclick="fetchDataFromCloud(true)">Cập nhật Cloud 🔄</button>
        </div>

        <div class="audio-wrapper">
            <button class="btn-speak" onclick="speakCurrentWord()">🔊</button>
        </div>

        <div class="flashcard-wrapper">
            <div class="flashcard" id="flashcard" onclick="flipCard()">
                <div class="card-face card-front">
                    <h2 id="display-word">Loading...</h2>
                    <span id="display-type" class="type"></span>
                    <div id="display-front-meaning" class="hint-meaning">Đang tải...</div>
                </div>
                <div class="card-face card-back">
                    <h2 id="display-meaning">Đang tải...</h2>
                </div>
            </div>
        </div>

        <div class="controls">
            <button class="btn-nav" onclick="prevCard()">◀ Trước</button>
            <button class="btn-nav btn-random" onclick="shuffleVocabulary()">Trộn từ 🎲</button>
            <span id="card-indicator">0 / 0</span>
            <button class="btn-nav" onclick="nextCard()">Sau ▶</button>
        </div>

        <div class="practice-section">
            <h3>✍️ Thực hành viết:</h3>
            <div class="practice-prompt" id="practice-prompt">Nghĩa gợi ý: ...</div>
            <div class="practice-input-group">
                <input type="text" id="practice-input" placeholder="Gõ từ tiếng Anh..." autocomplete="off" onkeypress="handlePracticeKeyPress(event)">
                <button onclick="checkAnswer()">Check</button>
            </div>
            <div class="practice-result" id="practice-result"></div>
        </div>

        <div class="input-section">
            <input type="text" id="input-word" placeholder="Từ tiếng Anh">
            <input type="text" id="input-type" placeholder="Từ loại">
            <input type="text" id="input-meaning" placeholder="Nghĩa">
            <button onclick="addWordToCloud()">Thêm từ</button>
        </div>

        <div class="word-list-section">
            <h3>Danh sách từ <span id="total-count" style="font-size: 0.85rem; color: #888;">(0 từ)</span></h3>
            <div id="word-list" class="word-list"></div>
        </div>
    </div>

    <script>
        // ========================================================
        // DÁN NGUYÊN VẸN CẤU HÌNH CŨ CỦA BẠN VÀO ĐÂY ĐỂ CHẠY
        // ========================================================
        const firebaseConfig = {
            apiKey: "MÃ_API_CỦA_BẠN",
            authDomain: "TÊN_DỰ_ÁN.firebaseapp.com",
            databaseURL: "https://TÊN_DỰ_ÁN-default-rtdb.firebaseio.com",
            projectId: "TÊN_DỰ_ÁN",
            storageBucket: "TÊN_DỰ_ÁN.appspot.com",
            messagingSenderId: "MÃ_SENDER_ID",
            appId: "MÃ_APP_ID"
        };

        const cleanBaseURL = firebaseConfig.databaseURL.replace(/\/$/, "");
        const REST_URL = `${cleanBaseURL}/shared_vocabulary.json`;

        let vocabulary = [];
        let vocabularyKeys = [];
        let currentIndex = 0;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            if (type === 'correct') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(130, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
                osc.start(); osc.stop(audioCtx.currentTime + 0.25);
            }
        }

        function initApp() {
            const localData = localStorage.getItem('raw_cached_vocab');
            const localKeys = localStorage.getItem('raw_cached_keys');
            if (localData && localKeys) {
                try {
                    vocabulary = JSON.parse(localData);
                    vocabularyKeys = JSON.parse(localKeys);
                    document.getElementById('status-text').innerText = `⚡ Sẵn sàng (${vocabulary.length} từ)`;
                    updateUI();
                } catch(e) { localStorage.clear(); }
                fetchDataFromCloud(false); // Gọi đồng bộ ngầm
            } else {
                fetchDataFromCloud(true);
            }
        }

        function fetchDataFromCloud(isManualClick) {
            const statusText = document.getElementById('status-text');
            if (isManualClick) statusText.innerText = "Đang kết nối...";

            fetch(REST_URL)
            .then(res => res.json())
            .then(data => {
                let newVocab = []; let newKeys = [];
                if (data && Object.keys(data).length > 0) {
                    Object.keys(data).forEach(key => {
                        if (data[key] && data[key].word && data[key].meaning) {
                            newVocab.push(data[key]); newKeys.push(key);
                        }
                    });
                    
                    // CHỈ CẬP NHẬT NẾU DỮ LIỆU TẢI VỀ KHÔNG BỊ TRỐNG RỖNG
                    if (newVocab.length > 0) {
                        localStorage.setItem('raw_cached_vocab', JSON.stringify(newVocab));
                        localStorage.setItem('raw_cached_keys', JSON.stringify(newKeys));
                        vocabulary = newVocab; vocabularyKeys = newKeys;
                        statusText.innerText = `Đã đồng bộ (${vocabulary.length} từ)`;
                        updateUI();
                    }
                } else if (data === null && isManualClick) {
                    // Chỉ xóa hết sạch khi bạn chủ động bấm nút làm mới và trên cloud trống trơn
                    localStorage.removeItem('raw_cached_vocab'); localStorage.removeItem('raw_cached_keys');
                    vocabulary = []; vocabularyKeys = []; statusText.innerText = "Kho trống."; updateUI();
                }
            }).catch(() => { if (isManualClick) statusText.innerText = "Lỗi mạng!"; });
        }

        // CHỈNH SỬA QUAN TRỌNG: Khóa cứng dữ liệu khi thêm từ
        function addWordToCloud() {
            const word = document.getElementById('input-word').value.trim();
            const type = document.getElementById('input-type').value.trim();
            const meaning = document.getElementById('input-meaning').value.trim();
            if (!word || !meaning) return alert('Nhập đủ Từ và Nghĩa!');

            const newWordObj = { word, type, meaning };
            
            // 1. Lưu chắc chắn vào bộ nhớ máy trước
            vocabulary.push(newWordObj);
            vocabularyKeys.push("temp_" + Date.now()); // Tạo key tạm thời để tránh lỗi undefined khi xóa ngay
            localStorage.setItem('raw_cached_vocab', JSON.stringify(vocabulary));
            localStorage.setItem('raw_cached_keys', JSON.stringify(vocabularyKeys));
            
            currentIndex = vocabulary.length - 1;
            updateUI();

            // 2. Đẩy lên đám mây ngầm
            fetch(REST_URL, { 
                method: 'POST', 
                body: JSON.stringify(newWordObj) 
            })
            .then(res => res.json())
            .then(data => {
                // Thay thế key tạm thời bằng key thật do Firebase trả về
                if(data && data.name) {
                    vocabularyKeys[vocabularyKeys.length - 1] = data.name;
                    localStorage.setItem('raw_cached_keys', JSON.stringify(vocabularyKeys));
                }
            })
            .catch(() => {
                console.log("Đã lưu offline, đồng bộ Cloud thất bại do mạng chậm.");
            });

            document.getElementById('input-word').value = '';
            document.getElementById('input-type').value = '';
            document.getElementById('input-meaning').value = '';
        }

        function deleteWordFromCloud(index) {
            const targetKey = vocabularyKeys[index];
            if(confirm(`Xóa từ "${vocabulary[index].word}"?`)) {
                vocabulary.splice(index, 1); vocabularyKeys.splice(index, 1);
                localStorage.setItem('raw_cached_vocab', JSON.stringify(vocabulary));
                localStorage.setItem('raw_cached_keys', JSON.stringify(vocabularyKeys));
                updateUI();
                
                // Nếu không phải key tạm thời thì mới gửi lệnh xóa lên Cloud
                if (targetKey && !targetKey.startsWith("temp_")) {
                    const deleteUrl = `${cleanBaseURL}/shared_vocabulary/${targetKey}.json`;
                    fetch(deleteUrl, { method: 'DELETE' });
                }
            }
        }

        function speakWord(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text); utterance.lang = 'en-US';
                window.speechSynthesis.speak(utterance);
            }
        }
        function speakCurrentWord() { if (vocabulary[currentIndex]) speakWord(vocabulary[currentIndex].word); }
        function flipCard() { document.getElementById('flashcard').classList.toggle('flip'); }

        function updateUI() {
            document.getElementById('total-count').innerText = `(${vocabulary.length} từ)`;
            const inputField = document.getElementById('practice-input'); const resultDiv = document.getElementById('practice-result');
            inputField.value = ''; inputField.style.borderColor = '#ddd'; resultDiv.style.display = 'none';

            if (vocabulary.length > 0) {
                if (currentIndex >= vocabulary.length) currentIndex = vocabulary.length - 1;
                if (currentIndex < 0) currentIndex = 0;
                const card = vocabulary[currentIndex];
                if (card && card.word) {
                    document.getElementById('display-word').innerText = card.word;
                    document.getElementById('display-type').innerText = card.type ? `(${card.type})` : '';
                    document.getElementById('display-front-meaning').innerText = card.meaning;
                    document.getElementById('display-meaning').innerText = card.meaning;
                    document.getElementById('card-indicator').innerText = `${currentIndex + 1} / ${vocabulary.length}`;
                    document.getElementById('practice-prompt').innerText = `Nghĩa gợi ý: ${card.meaning} ${card.type ? '('+card.type+')' : ''}`;
                }
            } else {
                document.getElementById('display-word').innerText = "Trống"; document.getElementById('display-type').innerText = "";
                document.getElementById('display-front-meaning').innerText = "Hãy thêm từ!"; document.getElementById('display-meaning').innerText = "Hãy thêm từ!";
                document.getElementById('card-indicator').innerText = "0 / 0"; document.getElementById('practice-prompt').innerText = "Chưa có từ.";
            }
            renderWordList();
        }

        function checkAnswer() {
            if (vocabulary.length === 0 || !vocabulary[currentIndex]) return;
            const inputField = document.getElementById('practice-input'); const resultDiv = document.getElementById('practice-result');
            const userAnswer = inputField.value.trim().toLowerCase(); const correctAnswer = vocabulary[currentIndex].word.trim().toLowerCase();
            resultDiv.style.display = 'block';
            if (userAnswer === correctAnswer) {
                playSound('correct'); inputField.style.borderColor = 'var(--success-color)';
                resultDiv.innerHTML = `<span style="color: var(--success-color);">🎉 Chính xác!</span>`; speakWord(vocabulary[currentIndex].word);
            } else {
                playSound('wrong'); inputField.style.borderColor = 'var(--error-color)';
                resultDiv.innerHTML = `<span style="color: var(--error-color);">❌ Sai rồi! Đáp án: <strong>${vocabulary[currentIndex].word}</strong></span>`;
            }
        }

        function handlePracticeKeyPress(event) { if (event.key === 'Enter') checkAnswer(); }
        function nextCard() { if (vocabulary.length > 1) { currentIndex = (currentIndex + 1) % vocabulary.length; updateUI(); } }
        function prevCard() { if (vocabulary.length > 1) { currentIndex = (currentIndex - 1 + vocabulary.length) % vocabulary.length; updateUI(); } }
        function shuffleVocabulary() {
            if (vocabulary.length <= 1) return;
            for (let i = vocabulary.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [vocabulary[i], vocabulary[j]] = [vocabulary[j], vocabulary[i]];
                if(vocabularyKeys[i] && vocabularyKeys[j]) [vocabularyKeys[i], vocabularyKeys[j]] = [vocabularyKeys[j], vocabularyKeys[i]];
            }
            currentIndex = 0; updateUI();
        }

        function renderWordList() {
            const list = document.getElementById('word-list'); list.innerHTML = '';
            const fragment = document.createDocumentFragment();
            vocabulary.forEach((item, index) => {
                if (item && item.word) {
                    const itemDiv = document.createElement('div'); itemDiv.className = 'word-item';
                    if(index === currentIndex) itemDiv.style.backgroundColor = '#e8f4fd';
                    itemDiv.innerHTML = `<div style="flex:1; cursor:pointer;"><strong>${item.word}</strong> (${item.type || 'n/a'}): ${item.meaning}</div><button class="btn-delete" onclick="event.stopPropagation(); deleteWordFromCloud(${index})">Xóa</button>`;
                    itemDiv.querySelector('div').onclick = () => { currentIndex = index; updateUI(); };
                    fragment.appendChild(itemDiv);
                }
            });
            list.appendChild(fragment);
        }

        initApp();
    </script>
</body>
</html>
